name: Deploy to EKS
on: 
  workflow_dispatch: 
    inputs: 
      image_tag: 
        required: true
        type: string
        description: Image tag to deploy (from CI pipeline)
permissions:
  id-token: write
  contents: read
env: 
  AWS_REGION: us-east-2
  CLUSTER_NAME: wanderlust
  ECR_BACKEND: 713881790523.dkr.ecr.us-east-2.amazonaws.com/wanderlust/backend
  ECR_FRONTEND: 713881790523.dkr.ecr.us-east-2.amazonaws.com/wanderlust/frontend
jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::713881790523:role/GitHubActionsOIDCRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME
      - name: Deploy MongoDB chart
        run: |
          helm upgrade --install mongodb ./wanderlust-chart/charts/mongodb \
            --namespace wanderlust --create-namespace
      - name: Deploy Redis chart
        run: |
          helm upgrade --install redis ./wanderlust-chart/charts/redis \
            --namespace wanderlust
      - name: Deploy Backend chart
        run: |
          helm upgrade --install backend ./wanderlust-chart/charts/backend \
            --namespace wanderlust \
            --set image.repository=$ECR_BACKEND \
            --set image.tag=${{ github.event.inputs.image_tag }}
      - name: Deploy Frontend chart
        run: |
          helm upgrade --install frontend ./wanderlust-chart/charts/frontend \
            --namespace wanderlust \
            --set image.repository=$ECR_FRONTEND \
            --set image.tag=${{ github.event.inputs.image_tag }}
      - name: Deploy Ingress chart
        run: |
          helm upgrade --install ingress ./wanderlust-chart/charts/ingress \
            --namespace wanderlust
      - name: Deploy Monitoring (Grafana + Prometheus)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            -f wanderlust-chart/charts/monitoring/values.yaml



  
